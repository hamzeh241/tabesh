name = "tabesh-requests-handler"
main = "src/index.js"
compatibility_date = "2024-11-01"

[d1_databases]
tabesh_requests_db = { database_name = "tabesh_requests_db", binding = "DB" }

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
FRONTEND_ORIGIN = "https://tabeshmachine.ir"
SESSION_TTL_SECONDS = "28800"
PWKDF2_ITERATIONS = "200000"

[observability]
enabled = true